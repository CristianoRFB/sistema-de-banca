<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220"><rect width="800" height="220" fill="white"/><text x="24" y="34" font-family="sans-serif" font-size="20">Multi-Tenant Architecture</text><text x="24" y="72" font-family="sans-serif" font-size="15">URL / slug -&gt; Tenant Resolver -&gt; bancas/{bancaId}</text><text x="24" y="108" font-family="sans-serif" font-size="15">TenantContext -&gt; Public / Client / Admin API</text><text x="24" y="144" font-family="sans-serif" font-size="15">Scheduled jobs -&gt; active tenants</text><text x="24" y="180" font-family="sans-serif" font-size="15">All operational data remains scoped by bancaId</text></svg>